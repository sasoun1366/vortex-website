name: Deploy to Cloudflare

# هر push روی main سایت را خودکار منتشر می‌کند.
# سکرت‌های لازم در Settings → Secrets and variables → Actions:
#   CLOUDFLARE_API_TOKEN   (Account → Workers Scripts → Edit)
#   CLOUDFLARE_ACCOUNT_ID
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Publish vortexgear
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - name: Deploy static site to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
